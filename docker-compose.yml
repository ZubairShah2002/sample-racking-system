services:
  db:
    image: postgres:16-alpine
    container_name: samplerack-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-samplerack}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-samplerack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: samplerack-api
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-samplerack};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Key: "${JWT_KEY:-change-this-to-a-long-random-secret-at-least-32-bytes-in-production}"
      Jwt__Issuer: "SampleRack"
      Jwt__Audience: "SampleRackClient"
      Jwt__ExpiryMinutes: "480"
      Seed__AdminUsername: "${ADMIN_USERNAME:-admin}"
      Seed__AdminPassword: "${ADMIN_PASSWORD:-Admin@12345}"
      Seed__AdminEmail: "${ADMIN_EMAIL:-admin@samplerack.local}"
      Swagger__Enabled: "${SWAGGER_ENABLED:-true}"
      FileStorage__RootPath: "/app/storage"
    volumes:
      - attachments:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5280}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: samplerack-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  attachments:
