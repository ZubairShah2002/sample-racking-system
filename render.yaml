# Render Blueprint — deploys the whole Sample Racking Management System:
#   • a managed PostgreSQL database
#   • the .NET API (Docker)
#   • the React frontend (static site), wired to the API
#
# To deploy: push this repo to GitHub, then on https://dashboard.render.com
# choose "New +" → "Blueprint", pick this repo, and click "Apply".
# Free tiers are used; see the notes at the bottom for production.

databases:
  - name: samplerack-db
    databaseName: samplerack
    plan: free
    postgresMajorVersion: "16"

services:
  # ---- Backend API (.NET 8, Docker) ----
  - type: web
    name: samplerack-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: samplerack-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true          # Render generates a strong random secret
      - key: Jwt__Issuer
        value: SampleRack
      - key: Jwt__Audience
        value: SampleRackClient
      - key: Jwt__ExpiryMinutes
        value: "480"
      - key: Seed__AdminUsername
        value: admin
      - key: Seed__AdminPassword
        sync: false                  # set this yourself in the dashboard (recommended)
      - key: Seed__AdminEmail
        value: admin@samplerack.local
      - key: Swagger__Enabled
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # ---- Frontend (React, static site) ----
  - type: web
    name: samplerack-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # The frontend calls the API directly at this origin (CORS is open on the
      # API). If Render assigned the API a different hostname, change this value
      # to match the API service's URL, then redeploy.
      - key: VITE_API_URL
        value: https://samplerack-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html     # SPA client-side routing

# Notes
# -----
# • Free PostgreSQL expires ~90 days after creation and free web services sleep
#   after inactivity (first request after sleep is slow). For an always-on site,
#   upgrade samplerack-api and samplerack-db to a paid plan in the dashboard.
# • If you leave Seed__AdminPassword unset, the app falls back to the default in
#   appsettings.json (admin / Admin@12345) — change it on first login either way.
