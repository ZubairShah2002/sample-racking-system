# Render Blueprint — deploys the whole Sample Racking Management System:
#   • a managed PostgreSQL database
#   • the .NET API (Docker)
#   • the React frontend (static site), wired to the API
#
# To deploy: push this repo to GitHub, then on https://dashboard.render.com
# choose "New +" → "Blueprint", pick this repo, and click "Apply".
# Free tiers are used; see the notes at the bottom for production.

# Database: this app now uses an external Neon Postgres (durable free tier —
# data is not deleted on a timer). The DATABASE_URL is set manually on the
# samplerack-api service (see below). The old Render-managed database block is
# left here commented out; delete the unused "samplerack-db" in the Render
# dashboard once you've confirmed Neon is working.
#
# databases:
#   - name: samplerack-db
#     databaseName: samplerack
#     plan: free
#     postgresMajorVersion: "16"

services:
  # ---- Backend API (.NET 8, Docker) ----
  - type: web
    name: samplerack-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Liveness only (no DB dependency) so the deploy succeeds as soon as the
    # server is listening; schema init runs in the background.
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false                  # set in the dashboard to your Neon DIRECT
                                     # (unpooled) connection string, e.g.
                                     # postgresql://USER:PASS@ep-xxx.REGION.aws.neon.tech/neondb?sslmode=require
                                     # Use the UNPOOLED/direct URL (host has no
                                     # "-pooler"): this app keeps its own
                                     # connection pool and runs schema init on
                                     # startup, which wants a direct connection.
      - key: Jwt__Key
        generateValue: true          # Render generates a strong random secret
      - key: Jwt__Issuer
        value: SampleRack
      - key: Jwt__Audience
        value: SampleRackClient
      - key: Jwt__ExpiryMinutes
        value: "480"
      - key: Seed__AdminUsername
        value: admin
      - key: Seed__AdminPassword
        sync: false                  # set this yourself in the dashboard (recommended)
      - key: Seed__AdminEmail
        value: admin@samplerack.local
      - key: Swagger__Enabled
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # ---- Frontend (React, static site) ----
  - type: web
    name: samplerack-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # The frontend calls the API directly at this origin (CORS is open on the
      # API). If Render assigned the API a different hostname, change this value
      # to match the API service's URL, then redeploy.
      - key: VITE_API_URL
        value: https://samplerack-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html     # SPA client-side routing

# Notes
# -----
# • Database is Neon (external). Neon's free tier does NOT delete your data on a
#   timer; idle only suspends compute, which resumes automatically on the next
#   query. Keep regular backups regardless (pg_dump).
# • Set DATABASE_URL on samplerack-api in the Render dashboard to your Neon
#   DIRECT (unpooled) connection string. The backend parses the URL's sslmode.
# • Free web services still sleep after inactivity (first request after sleep is
#   slow). Upgrade samplerack-api to a paid plan for an always-on site.
# • If you leave Seed__AdminPassword unset, the app falls back to the default in
#   appsettings.json (admin / Admin@12345) — change it on first login either way.
