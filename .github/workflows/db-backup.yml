name: Neon DB Backup

# Weekly backup of the Neon Postgres database, so your QC records survive even
# if the database is ever lost. Runs every Sunday, and can be run on demand.
#
# SETUP (one time): add a repository secret named NEON_DATABASE_URL
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#   Value: your Neon DIRECT (unpooled) connection string, e.g.
#   postgresql://USER:PASS@ep-xxx.REGION.aws.neon.tech/neondb?sslmode=require
#
# Each run:
#   • uploads a gzipped SQL dump as a workflow artifact (downloadable, kept 90 days)
#   • also commits it to a dedicated "db-backups" branch for long-term history
#     (this branch is separate from main, so it never triggers a Render deploy)

on:
  schedule:
    - cron: "17 3 * * 0" # Sundays 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump Neon database
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::Missing secret NEON_DATABASE_URL. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p _backup
          # pg_dump 17 via Docker so the client matches modern Neon servers.
          docker run --rm postgres:17-alpine \
            pg_dump "$NEON_DATABASE_URL" --no-owner --no-privileges --clean --if-exists \
            | gzip -9 > "_backup/samplerack-$STAMP.sql.gz"
          ls -lh _backup

      - name: Upload backup artifact (kept 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: samplerack-db-backup-${{ env.STAMP }}
          path: _backup/*.sql.gz
          retention-days: 90

      - name: Archive to db-backups branch (long-term history)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin db-backups:db-backups 2>/dev/null || git branch db-backups
          git worktree add wt db-backups
          mkdir -p wt/backups
          cp _backup/*.sql.gz wt/backups/
          ( cd wt && git add backups && git commit -m "DB backup $STAMP" && git push origin db-backups ) || echo "nothing to archive"
